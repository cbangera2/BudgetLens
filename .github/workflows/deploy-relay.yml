name: Deploy assistant relay

on:
  push:
    branches: [feat/assistant-relay, main]
    paths:
      - workers/assistant-relay/**
      - src/features/assistant/demo-models.ts
      - src/features/assistant/relay-policy.ts
      - .github/workflows/deploy-relay.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - name: Deploy with Wrangler
        working-directory: workers/assistant-relay
        run: npx -y wrangler@4.129.0 deploy
        env:
          # Human-provisioned token with Workers deploy rights. Single-account
          # tokens let Wrangler infer the account id.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
