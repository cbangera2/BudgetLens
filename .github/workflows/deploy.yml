name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege for Pages deployment (see https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication)
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one Pages deployment at a time; don't cancel in-progress production deploys
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        run: pnpm build
        env:
          # vite.config.ts uses GITHUB_ACTIONS to set base="/BudgetLens/" automatically.
          # Override with VITE_BASE=/ for a custom domain.
          GITHUB_ACTIONS: "true"
          # Baked shared key for demo mode (free models only, enforced in-app).
          # Runs on main builds only (this workflow fires on push to main).
          # Missing/empty secret = demo preset hidden, app behaves as before.
          VITE_OPENROUTER_DEMO_KEY: ${{ secrets.OPENROUTER_KEY }}
          # Relay origin (Cloudflare Worker). Empty until the human first
          # deploy sets the secret; while empty, demo uses the direct path.
          VITE_ASSISTANT_RELAY_URL: ${{ secrets.VITE_ASSISTANT_RELAY_URL }}

      - name: Prepare Pages artifact (SPA fallback + disable Jekyll)
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
